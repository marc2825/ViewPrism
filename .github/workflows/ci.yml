name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.8.6
      - run: ruff check .

  pure:
    name: Pure tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy
      - name: Pure unit tests (no bpy)
        run: python -m unittest discover -v -s tests/pure -p "test_*.py"
      - name: Independent harness self-test
        run: python -m unittest discover -s viewpass-dev/harness -p "test_*.py"

  blender:
    # Real Blender in a virtual X display with Mesa's software OpenGL (llvmpipe):
    # independent harness (background + GPU), GUI/GPU suite, extension build and package lifecycle.
    name: Blender ${{ matrix.series }} (Linux, Mesa llvmpipe OpenGL)
    needs: pure
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: '5.3'
            steps: pure,selftest,harness,gui,build,package
          # The manifest requires 5.3 (only verified versions), so installing the package on 4.5 is
          # refused by design; 4.5 runs the code-level checks to find out whether it can be supported.
          - series: '4.5'
            steps: pure,selftest,harness,gui,build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System libraries for Blender + virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1 libegl1 libgl1-mesa-dri libglx-mesa0 \
            mesa-vulkan-drivers libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 \
            libxkbcommon-x11-0 libsm6 libice6 libx11-6 libxext6 libdbus-1-3 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1 libdecor-0-0 > /dev/null
      - name: Resolve Blender version
        id: ver
        run: echo "version=$(bash .github/scripts/fetch_blender.sh resolve ${{ matrix.series }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender
          key: blender-linux-${{ steps.ver.outputs.version }}
      - name: Download Blender ${{ steps.ver.outputs.version }} (SHA-256 verified)
        id: blender
        run: echo "exe=$(bash .github/scripts/fetch_blender.sh fetch ${{ steps.ver.outputs.version }} '${{ runner.temp }}/blender')" >> "$GITHUB_OUTPUT"
      - name: Run checks
        run: |
          "${{ steps.blender.outputs.exe }}" --version | head -n 1
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            python tools/run_all_checks.py --blender "${{ steps.blender.outputs.exe }}" \
              --backends opengl --steps ${{ matrix.steps }} --out "${{ runner.temp }}/evidence"
      - name: Job summary
        if: always()
        run: cat "${{ runner.temp }}/evidence/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-blender-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
