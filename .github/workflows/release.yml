name: Release

# A pushed tag "vX.Y.Z" builds the extension ZIP with Blender's own tooling (validate + build + audit)
# and publishes a GitHub release with the ZIP and its SHA-256. Versions below 1.0.0 or with a
# pre-release suffix (vX.Y.Z-beta.1) are published as *pre-releases*. Uploading to
# extensions.blender.org stays a manual, owner-approved step. Manual runs only build the ZIP.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # only used by the release step on tag pushes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve Blender version
        id: ver
        run: echo "version=$(bash .github/scripts/fetch_blender.sh resolve 5.3)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/blender
          key: blender-linux-${{ steps.ver.outputs.version }}
      - name: Download Blender (SHA-256 verified)
        id: blender
        run: echo "exe=$(bash .github/scripts/fetch_blender.sh fetch ${{ steps.ver.outputs.version }} '${{ runner.temp }}/blender')" >> "$GITHUB_OUTPUT"
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(grep -E '^version *=' viewprism/blender_manifest.toml | sed -E 's/.*"(.*)".*/\1/')"
          test "v${manifest}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != manifest ${manifest}"; exit 1; }
      - name: Validate, build and audit
        run: python tools/build_extension.py --blender "${{ steps.blender.outputs.exe }}" --out dist
      - name: Checksum
        run: cd dist && for f in *.zip; do sha256sum "$f" > "$f.sha256"; done && cat ./*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: viewprism-extension
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Install: Blender 4.5 or newer → Edit › Preferences › Get Extensions › ⌄ › Install from Disk… → \`viewprism-${version}.zip\`."
            echo
            awk -v v="$version" 'index($0, "## " v " ") == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md
          } > notes.md
          test -s notes.md && cat notes.md
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flag=""
          case "$version" in 0.*|*-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --repo "$GITHUB_REPOSITORY" \
            --title "ViewPrism ${GITHUB_REF_NAME}" --notes-file notes.md $flag
