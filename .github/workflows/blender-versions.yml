name: Blender versions

# Weekly report: are the Blender builds pinned in ci/blender.lock still the newest patch releases?
# A failed run means a newer patch exists; update with `python tools/update_blender_lock.py --write`
# in a pull request (CI then verifies the new archives). Read-only: this workflow changes nothing.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check pinned Blender versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/update_blender_lock.py | tee -a "$GITHUB_STEP_SUMMARY"
