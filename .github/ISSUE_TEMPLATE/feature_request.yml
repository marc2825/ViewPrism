name: Feature request
description: A pass, format or workflow you need
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the task (e.g. "depth sequence for video ControlNet"), not only the feature.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
  - type: textarea
    id: format
    attributes:
      label: Exact format needed
      description: Value ranges, bit depth, axis conventions, file naming, target tool (if relevant).
