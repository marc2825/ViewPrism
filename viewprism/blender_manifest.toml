schema_version = "1.0.0"

# ViewPrism - Viewport Pass Exporter. Free distribution under GPL-3.0-or-later.
id = "viewprism"
version = "0.2.0"
name = "ViewPrism"
tagline = "Viewport Pass Exporter: aligned depth, normal, ID and mask"
maintainer = "marc2825"
website = "https://github.com/marc2825/ViewPrism"
type = "add-on"

tags = ["3D View", "Render", "Import-Export"]

# Verified with the test suites on 4.5 LTS, 5.0, 5.1, 5.2 and 5.3 (see docs/QA_REPORT.md).
blender_version_min = "4.5.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 marc2825",
]

[permissions]
files = "Write exported pass images and metadata to the folder you choose"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "/.git/",
  "*.viewprism-tmp",
]
