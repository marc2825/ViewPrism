schema_version = "1.0.0"

# ViewPrism - Viewport Pass Exporter. Do not publish without the owner's approval.
id = "viewprism"
version = "0.1.0"
name = "ViewPrism"
tagline = "Viewport Pass Exporter: aligned depth, normal, ID and mask"
maintainer = "marc2825"
website = "https://github.com/marc2825/ViewPrism"
type = "add-on"

tags = ["3D View", "Render", "Import-Export"]

# Only versions verified with the test suites (see docs/STATUS.md): 4.5 LTS and 5.3.
blender_version_min = "4.5.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 marc2825",
]

[permissions]
files = "Write exported pass images and metadata to the folder you choose"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "*.pyc",
  "/.git/",
  "*.viewprism-tmp",
]
